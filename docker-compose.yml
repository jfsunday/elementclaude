services:
  elementclaude:
    build: .
    container_name: elementclaude
    restart: unless-stopped
    env_file: .env
    environment:
      # Workspace path must be identical on host and inside the container so
      # that Claude's session store (~/.claude/projects/<encoded-cwd>/) matches
      # for both elementclaude-started runs and ones you started in your own
      # terminal with `claude`.
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:-${HOME}/Projekte}
      # ANTHROPIC_BASE_URL is read from .env via env_file; expose it explicitly
      # so the `claude` subprocess sees it (some compose versions don't pass
      # env_file vars to nested processes).
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
    volumes:
      - ./data:/data
      # Claude's home — read-write so sessions, history, etc. persist back to host.
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.claude.json:/root/.claude.json
      # Workspace mount: source path == target path so session paths match.
      - ${WORKSPACE_ROOT:-${HOME}/Projekte}:${WORKSPACE_ROOT:-${HOME}/Projekte}
    ports:
      - "${HOST_PORT:-7075}:8000"
    networks:
      - matrix-tools

networks:
  matrix-tools:
    external: true

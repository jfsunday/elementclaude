[project]
name = "elementclaude"
version = "0.1.0"
description = "Claude Code in a Matrix/Element room — via the messaging-bot REST bridge."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.117",
    "uvicorn[standard]>=0.32,<0.35",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "aiosqlite>=0.20,<1",
    "httpx>=0.27,<1",
    "claude-agent-sdk>=0.0.10",
    "anyio>=4.6,<5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.matrix", "app.rooms", "app.commands", "app.agent", "app.reactions"]
